allowBuilds:
  better-sqlite3: true
  core-js-pure: true
  couchbase: true
  es5-ext: true
  esbuild: true
  hnswlib-node: true
  onnxruntime-node: true
  oracledb: true
  protobufjs: true
  sharp: true
  tesseract.js: true

# Supply-chain cooldown: refuse to resolve package versions published less than
# 3 days ago. Compromised releases in the recent npm worm campaigns were pulled
# within hours to ~2 days of publication; the cooldown means a poisoned version
# ages out of the registry before we can install it. 3 days (not more) because
# several of our dependency floors track fast-publishing upstreams (the AWS SDK
# releases daily) and a longer window fights every fresh floor bump. Override
# per-install when needed: pnpm install --config.minimum-release-age=0
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@nhtio/*'
  # @anthropic-ai/sdk is excluded because its publish chain defeats the specific
  # threat the cooldown exists for, and this was verified rather than assumed:
  #   - Published by a GitHub Actions TRUSTED PUBLISHER via OIDC
  #     (_npmUser: npm-oidc-no-reply@github.com). There is no long-lived npm
  #     token to steal, which is the vector every recent worm campaign used.
  #   - Registry signature AND SLSA provenance attestation both verify
  #     (`npm audit signatures` → "verified registry signatures" +
  #     "verified attestations").
  #   - The provenance attests the tarball was built by GitHub's hosted runner
  #     from anthropics/anthropic-sdk-typescript, workflow create-releases.yml,
  #     commit 3b45cd3b69c956ac63384fdb09ce1d8109f3fa80 — and the GitHub release
  #     sdk-v0.115.0 targets that SAME commit. Chain closes end to end.
  #   - Zero install scripts (no preinstall/install/postinstall), so nothing
  #     executes at install time. Two runtime deps. MIT.
  # Re-verify on a major bump with:
  #   npm view @anthropic-ai/sdk@<v> --json   (check dist.signatures + _npmUser.trustedPublisher)
  #   npm audit signatures                    (in a scratch install)
  #   curl the dist.attestations.url          (confirm repo + workflow + commit)
  - '@anthropic-ai/sdk'

overrides:
  npm-run-path: 5.3.0
  # Security floors for transitive deps (dev tree; see CHANGELOG):
  # monaco-editor pins an older dompurify with multiple published XSS bypasses.
  dompurify: '>=3.4.0'
  # chevrotain (via prettier-plugin-edgejs) pins lodash-es with a code-injection
  # advisory in _.template.
  lodash-es: '>=4.18.1'
  # exceljs pins uuid@^8, which has a buffer-bounds advisory in v3/v5/v6.
  'exceljs>uuid': '^11.1.1'
